name: Build Kalashnikov for GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "kalashnikov.html"
      - "build.py"
      - "assets/**"
      - ".github/workflows/build-docs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kalashnikov-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependency
        run: python -m pip install Pillow

      - name: Generate the published site
        run: python build.py

      - name: Commit generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "Published files are already up to date."
          else
            git commit -m "Build GitHub Pages site"
            git push
          fi
