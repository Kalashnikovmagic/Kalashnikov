<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>
// Запущено с экрана «Домой» как приложение — запрещаем зум (щипок, двойной тап, автозум полей).
if (matchMedia("(display-mode: standalone)").matches || navigator.standalone) {
  document.querySelector('meta[name=viewport]').setAttribute("content", "width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover");
  document.documentElement.style.touchAction = "pan-x pan-y";
  ["gesturestart", "gesturechange", "gestureend"].forEach(t => document.addEventListener(t, e => e.preventDefault(), {passive: false}));
  document.addEventListener("touchmove", e => { if (e.touches.length > 1) e.preventDefault() }, {passive: false});
  let lastTap = 0;
  document.addEventListener("touchend", e => { const now = Date.now(); if (now - lastTap < 300 && !e.target.closest("input,textarea,select")) e.preventDefault(); lastTap = now }, {passive: false});
}
</script>

<style>
/* Layout: one phone-width column, cards by role, fixed tab bar at the bottom. Palette from GYMbro: dark by default (ink black, bone, lime), light — bone ground with olive highlights. --hl is lime/olive for text and lines, --accent is lime for fills. */
:root{
  --bg:#050505; --surface:#121212; --surface2:#1C1C1B; --ink:#EEEAE1; --muted:#8D8D87; --line:rgba(238,234,225,.16);
  --accent:#D8FD3E; --accent-ink:#050505; --accent-soft:rgba(216,253,62,.12); --hl:#D8FD3E; --glow:rgba(216,253,62,.12);
  --red:#F18B8B; --yellow:#EEEAE1; --green:#D8FD3E; --red-soft:#39191C; --green-soft:rgba(216,253,62,.14);
  --f-display:"Oswald","Arial Narrow",Impact,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px; color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#EEEAE1; --surface:#FAF8F3; --surface2:#E3DFD5; --ink:#0B0B0A; --muted:#6A6862; --line:rgba(11,11,10,.13);
  --accent:#D8FD3E; --accent-ink:#050505; --accent-soft:rgba(140,180,0,.16); --hl:#4F6E00; --glow:rgba(170,215,0,.22);
  --red:#B93A30; --yellow:#9C9789; --green:#4F6E00; --red-soft:#F5DAD5; --green-soft:rgba(110,150,0,.16); color-scheme:light}
@media (prefers-color-scheme: light){ :root[data-theme="auto"]{
  --bg:#EEEAE1; --surface:#FAF8F3; --surface2:#E3DFD5; --ink:#0B0B0A; --muted:#6A6862; --line:rgba(11,11,10,.13);
  --accent:#D8FD3E; --accent-ink:#050505; --accent-soft:rgba(140,180,0,.16); --hl:#4F6E00; --glow:rgba(170,215,0,.22);
  --red:#B93A30; --yellow:#9C9789; --green:#4F6E00; --red-soft:#F5DAD5; --green-soft:rgba(110,150,0,.16); color-scheme:light} }
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:radial-gradient(circle at 92% 0,var(--glow),transparent 25%) fixed,var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#app{max-width:640px;margin:0 auto;padding-block:12px 24px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:28px;line-height:1.1;text-transform:uppercase}
h2{font-size:19px;text-transform:uppercase}
h3{font-size:16px}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.flat{background:transparent;padding:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
button,.btn{font:inherit;color:inherit;cursor:pointer;border:0;background:var(--surface2);border-radius:10px;padding:9px 12px;font-weight:500;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--hl);outline-offset:2px}
.btn-primary{background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn-ghost{background:transparent;color:var(--hl);padding:6px 8px}
.btn-sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn-danger{background:var(--red-soft);color:var(--red)}
.icon-btn{width:34px;height:34px;padding:0;border-radius:9px;flex:none}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface2);border:1px solid transparent;border-radius:10px;padding:9px 10px;min-width:0;width:100%}
textarea{resize:vertical;min-height:60px}
input[type=number]{font-variant-numeric:tabular-nums}
label.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.seg{display:flex;background:var(--surface2);border-radius:11px;padding:3px;gap:2px}
.seg button{flex:1;background:transparent;padding:7px 6px;font-size:13px;border-radius:8px}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;background:var(--surface2);font-size:12px;font-weight:500}
.chip.up{background:var(--green-soft);color:var(--green)} .chip.down{background:var(--red-soft);color:var(--red)}
.chip.acc{background:var(--accent-soft);color:var(--hl)}
button.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
/* checklist */
.check{display:flex;align-items:center;gap:10px;padding:7px 2px;border-bottom:1px solid var(--line);min-width:0}
.check:last-child{border-bottom:0}
.box{width:24px;height:24px;flex:none;border-radius:7px;border:2px solid var(--line);background:transparent;padding:0;display:grid;place-items:center;color:var(--accent-ink)}
.box[aria-checked=true]{background:var(--accent);border-color:var(--hl)}
.box svg{width:14px;height:14px;opacity:0}
.box[aria-checked=true] svg{opacity:1}
.check .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.check.multi{flex-wrap:wrap}
.parts{flex-basis:100%;display:flex;gap:6px;padding-left:34px}
.part{flex:1;min-width:0;height:32px;padding:0;border-radius:9px;font-size:13px;font-variant-numeric:tabular-nums}
.part[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.check.done .txt{color:var(--muted);text-decoration:line-through}
.x{background:transparent;color:var(--muted);padding:4px 6px;font-size:18px;line-height:1}
.add{display:flex;gap:6px}
.add input{flex:1}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:transparent;flex-direction:column;gap:2px;padding:8px 2px 9px;font-size:11px;color:var(--muted);border-radius:0}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current=page]{color:var(--hl);font-weight:600}
/* kpi */
.kpi{background:var(--surface);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .v{font-family:var(--f-display);font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
/* plate stripe: a program's color */
.plate{width:8px;align-self:stretch;border-radius:4px;flex:none}
.p-A{background:var(--red)} .p-B{background:var(--hl)} .p-C{background:var(--yellow)} .p-X{background:var(--muted)}
/* workout logger */
.ex-head{display:flex;gap:10px;align-items:flex-start}
.ex-n{font-family:var(--f-display);font-size:22px;color:var(--muted);min-width:30px;flex:none;line-height:1.1}
.sets{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) minmax(0,1.1fr) 40px;gap:6px;align-items:center}
.sets .h{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sets input{padding:8px 6px;text-align:center}
.sets .prev{font-size:12px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.sets .sn{font-family:var(--f-display);color:var(--muted);text-align:center}
.sets .box{width:36px;height:36px;border-radius:10px}
.sets input.done{background:var(--green-soft)}
.ss{border:1px solid var(--hl);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:10px;background:var(--accent-soft)}
.heat{display:grid;grid-template-columns:repeat(30,minmax(0,1fr));gap:2px}
.heat i{aspect-ratio:1;border-radius:2px;background:var(--surface2)}
.heat i.on{background:var(--hl)}
.game .gm-streak{display:flex;flex-direction:column;align-items:center;gap:0;background:var(--surface2);border-radius:16px;padding:8px 10px;min-width:62px;color:var(--muted)}
.game .gm-streak svg{width:30px;height:30px;opacity:.45;filter:grayscale(1)}
.game .gm-streak .num{font-size:22px;line-height:1}
.game .gm-streak.on{color:var(--ink)} .game .gm-streak.on svg{opacity:1;filter:none}
@media (prefers-reduced-motion:no-preference){ .game .gm-streak.on svg{animation:flick 1.6s ease-in-out infinite} }
@keyframes flick{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.08) rotate(-3deg)}}
.ico-s{width:14px;height:14px;vertical-align:-2px}
.ach{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ach button{flex-direction:column;align-items:flex-start;text-align:left;gap:6px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0}
.ach svg{width:40px;height:40px}
.ach .t0 svg{opacity:.35;filter:grayscale(1)}
.cele-bg{position:fixed;inset:0;z-index:50;background:rgba(5,5,5,.6);display:grid;place-items:center;padding:24px}
.cele-card{background:var(--surface);border:1px solid var(--hl);border-radius:24px;padding:26px 22px;max-width:340px;width:100%;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.cele-card svg{width:88px;height:88px}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.done-hero{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.done-hero svg{width:72px;height:72px}
.pr-pop{background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:10px 12px;font-weight:600}
@media (prefers-reduced-motion:no-preference){ .cele-card{animation:pop .45s cubic-bezier(.22,1.4,.36,1)} .pr-pop{animation:pop .45s cubic-bezier(.22,1.4,.36,1) both} }
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.chest-anim svg{width:110px;height:110px}
@media (prefers-reduced-motion:no-preference){ .chest-anim{animation:shake 1.2s ease-in-out infinite} }
@keyframes shake{0%,70%,100%{transform:rotate(0)}75%{transform:rotate(-8deg)}85%{transform:rotate(8deg)}95%{transform:rotate(-4deg)}}
.gm-chest{display:flex;align-items:center;gap:4px;background:var(--surface2);border-radius:12px;padding:6px 10px;font-weight:600}
.gm-chest svg{width:22px;height:22px}
.radar text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.radar text.lv{fill:var(--ink);font-weight:600}
.gold-day{border-color:#E8C547!important;box-shadow:0 0 0 1px #E8C547 inset}
.chip.gold{background:rgba(232,197,71,.18);color:#C79A1B}
.trophy{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.trophy:last-child{border-bottom:0}
.trophy svg{width:30px;height:30px;flex:none}
.restbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:19;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.restbar .in{max-width:640px;margin:0 auto 8px;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.restbar .t{font-family:var(--f-display);font-size:26px;font-variant-numeric:tabular-nums;min-width:70px}
.restbar button{background:rgba(127,127,127,.25);color:inherit}
.restbar .bar{flex:1;height:6px;border-radius:3px;background:rgba(127,127,127,.3);overflow:hidden}
.restbar .bar i{display:block;height:100%;background:var(--bg)}
/* sheet */
.sheet-bg{position:fixed;inset:0;z-index:30;background:rgba(5,8,12,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:86vh;overflow:auto;border-radius:18px 18px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.pick{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;background:var(--surface);border-radius:10px;text-align:left;width:100%}
/* table */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
tr.sel td{background:var(--accent-soft)}
tr[data-a]{cursor:pointer}
/* days */
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.dayhd{display:flex;justify-content:space-between;align-items:baseline}
.today-mark{color:var(--hl)}
.state-row{display:flex;gap:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.pickrow{display:flex;gap:6px;flex-wrap:wrap}
.pickrow button{min-width:40px;padding:7px 9px}
.pickrow button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.meter{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--hl);border-radius:4px}
.meter.over i{background:var(--red)}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.banner{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13px}
.empty{padding:16px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:12px;font-size:14px}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px)}
.photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.photos figure{margin:0;display:flex;flex-direction:column;gap:4px}
.photos img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:var(--surface2)}
.thumbs{display:flex;gap:6px;overflow-x:auto}
.thumbs img{width:64px;height:84px;object-fit:cover;border-radius:8px;flex:none}
details.art{background:var(--surface);border-radius:12px;padding:12px 14px}
details.art summary{cursor:pointer;font-weight:600}
details.art p,details.art li{color:var(--ink);max-width:65ch}
.menu{display:flex;flex-direction:column;gap:6px}
.lock{min-height:60vh;display:grid;place-items:center;text-align:center}
@media (max-width:420px){ h1{font-size:24px} .kpi .v{font-size:21px} }
@media (prefers-reduced-motion:no-preference){ .box,.seg button{transition:background .15s} }
</style>

<script>
"use strict";
/* ---------- справочник упражнений (из FullBody, FullBody1, FullBody2 и старого трекера) ---------- */
const EX = {
  leg_curl:{n:"Сгибания ног в тренажёре",g:"Ноги",tip:"Таз прижат к скамье, валик над пятками. Сгибай до упора, опускай медленно 2–3 секунды."},
  leg_ext:{n:"Разгибания ног в тренажёре",g:"Ноги",tip:"Ось колена на одной линии с осью тренажёра. Пауза в верхней точке, без рывка вниз."},
  leg_press:{n:"Жим ногами",g:"Ноги",tip:"Поясница прижата к спинке. Стопы на ширине плеч, колени смотрят по носкам, не выпрямляй их до замка."},
  row_seated:{n:"Тяга сидя (нижний блок)",g:"Спина",tip:"Грудь вперёд, плечи вниз. Тяни локтями к поясу, своди лопатки, корпус не раскачивай."},
  lat_pull:{n:"Тяга сверху",g:"Спина",tip:"Тяни гриф к верху груди, локти вниз и назад. Не отклоняйся сильно назад."},
  pullover_machine:{n:"Отведение за спину в тренажёре",g:"Спина",tip:"Руки почти прямые, движение за счёт широчайших. Медленный возврат."},
  db_incline:{n:"Жим гантелей на наклонной скамье",g:"Грудь",tip:"Угол 30–45°. Лопатки сведены, гантели опускай к верхней части груди, локти под 45° к корпусу."},
  hammer_press:{n:"Жим в хаммере",g:"Грудь",tip:"Лопатки сведены и прижаты к спинке, рукояти на уровне середины груди."},
  dips_machine:{n:"Брусья в тренажёре",g:"Грудь",tip:"Небольшой наклон вперёд, локти не разводи широко, опускайся до 90° в локте."},
  bench:{n:"Жим штанги лёжа, средний хват",g:"Грудь",tip:"Мост в пояснице небольшой, лопатки сведены, ноги упираются в пол. Опускай штангу на низ груди."},
  chest_horiz:{n:"Горизонтальный жим от груди",g:"Грудь",tip:"Рукояти на уровне середины груди, лопатки прижаты к спинке, выжимай без замка в локтях."},

function recipeCalc(ri){ const r=RECIPES[ri], sc=UI.rscale?.[ri]||1, xs=r.unit?` — ${fmtN(sc)} ${r.unit}`:sc!==1?" ×"+fmtN(sc):"";
  if(r.fixed) return {r,sc,lines:[],t:{k:r.fixed.k*sc,p:r.fixed.p*sc,f:r.fixed.f*sc,c:r.fixed.c*sc},label:r.n+xs}; const sel=UI.rsel[ri]||{}; const lines=r.items.map((it,ii)=>{const id=Array.isArray(it.f)?it.f[sel[ii]||0]:it.f; const fd=FOOD[id]; const g=it.g*sc, m=g/100;
  return {ii,id,fd,g,u:sc===1?it.u:"",alts:Array.isArray(it.f)?it.f:null,k:fd.k*m,p:fd.p*m,f:fd.f*m,c:fd.c*m}});
  const t=lines.reduce((a,l)=>({k:a.k+l.k,p:a.p+l.p,f:a.f+l.f,c:a.c+l.c}),{k:0,p:0,f:0,c:0});
  return {r,sc,lines,t,label:r.n+(lines.some(l=>l.alts)?" ("+lines.filter(l=>l.alts).map(l=>FOOD[l.id].n.split(" (")[0].toLowerCase()).join(", ")+")":"")+xs} }
const ARTICLES=[
  {n:"Как устроены программы FullBody",b:["Каждая тренировка прорабатывает всё тело: ноги, спину, грудь, плечи, руки и пресс.","Порядок: 10 минут эллипса, силовой блок, пресс, 15 минут кардио, заминка.","Чередуй A → B → C. Приложение само подскажет, какая тренировка следующая.","Между тренировками нужен минимум день отдыха: 3 тренировки в неделю — рабочий ритм."]},
  {n:"Как прибавлять вес",b:["Работай в диапазоне повторов программы, например 6–8.","Когда во всех 4 подходах набрал верхнюю границу (8), в следующий раз добавь 2,5–5 кг.","Если после прибавки получается меньше нижней границы (6), оставь вес, пока снова не выйдешь на 8.","Колонка «Прошлый раз» в тренировке показывает, что ты делал в прошлый раз — старайся побить хотя бы один подход."]},
  {n:"Как записывать подтягивания со своим весом",b:["В поле веса ничего не пиши: это подтягивания с собственным весом. Записывай только повторы в каждом подходе.","Прогресс считается по лучшему подходу в повторах: он виден в «Прогрессе» и в «Рабочих весах».","Схема: 4 подхода в диапазоне, например 6–10. Когда во всех четырёх сделал 10 — повесь 2,5 кг на пояс и пиши их в «доп. кг». С этого момента прогресс считается по весу отягощения.","Если чисто подтянуться больше не можешь, а подход не закончен, добери 1–2 медленных негатива (опускание 3–5 секунд) и напиши об этом в заметке к тренировке.","Раз в неделю взвешивайся: при рекомпозиции вес тела немного падает, и те же повторы становятся чуть легче. Это нормально."]},
  {n:"Отдых между подходами",b:["В FullBody A — 2 минуты, в B и C — 2–3 минуты. Для перекрёстных скручиваний — 15 секунд.","Таймер отдыха запускается сам, когда отмечаешь подход. Кнопка +30 добавляет время."]},
  {n:"Кардио и пульс",b:["После силовой — 15 минут кардио на выбор: велоэргометр, дорожка в гору или гребля.","Пульс не выше 150 уд/мин: это зона, где тренируется выносливость и не мешает восстановлению."]},
  {n:"Разминка и заминка",b:["10 минут эллипса разогревают суставы и поднимают пульс.","Перед первым упражнением на каждую группу сделай 1–2 лёгких подхода с половиной рабочего веса.","В конце 5–10 минут растяжки: бёдра, ягодицы, грудь, широчайшие."]},
  {n:"КБЖУ: с чего начать",b:["Посчитай норму калорий в разделе «Питание». Формула Миффлина–Сан Жеора учитывает пол, возраст, рост, вес и активность.","Белок: 1,6–2 г на кг веса. Жиры: 0,8–1 г на кг. Остальное — углеводы.","Для похудения — минус 15% калорий, для набора — плюс 10%.","Записывай еду каждый день: отметка «Вести КБЖУ» в привычках ставится легче, когда видишь цифры."]},
  {n:"Рекомпозиция: мышцы и минус жир одновременно",b:["Это возможно и для тренированных людей: нужны прогрессия нагрузок, много белка и небольшой дефицит или ноль по калориям (обзор Barakat и соавт., 2020). Лучше всего получается у новичков, у тех, кто вернулся после перерыва, и у людей с лишним жиром.","Калории: минус 10% от расхода, но не больше 500 ккал. При дефиците больше примерно 500 ккал в сутки прирост мышц от тренировок блокируется, хотя сила растёт (метаанализ Murphy и Koehler, 2022).","Белок: 1,6–2,4 г на кг веса. Метаанализ Morton 2018: рост мышц выходит на плато около 1,6 г/кг, верхняя граница — 2,2. В дефиците нужно больше: 2,4 г/кг дали +1,2 кг мышц и −4,8 кг жира за 4 недели, 1,2 г/кг — без прироста мышц (Longland 2016). В приложении взято 2,2 г/кг.","Жиры: не меньше 0,8 г на кг и около 25% калорий. Углеводы — остаток, основную часть ешь вокруг тренировки.","Темп: вес стоит или снижается до 0,5% в неделю. Чем меньше в тебе жира, тем медленнее нужно идти (позиция ISSN, Aragon 2017).","Контроль: раз в неделю вес и талия, плюс рабочие веса. Если весы почти не двигаются, а талия уменьшается и веса растут, всё работает."]},

function xpParts(k){ const C=gmCache(), d=peekDay(k), ws=C.byDate[k]||[];
  return {sets:ws.reduce((a,w)=>a+wSets(w),0)*2, workouts:ws.length*50, prs:ws.reduce((a,w)=>a+C.prs[w.id],0)*25, habits:settings().habits.filter(h=>d?.habits?.[h.id]).length*10,

function xpDay(k){ const C=gmCache(); if(C.xp[k]==null){ const g=gm(); const base=Object.values(xpParts(k)).reduce((a,b2)=>a+b2,0); C.xp[k]=base*(g.double.includes(k)?2:1)+(g.bonus[k]||0) } return C.xp[k] }

function goldenDay(k){ const d=peekDay(k); if(!d||!habitsAll(k)||(d.tasks||[]).some(t=>!t.done)||!questsFor(k).every(q=>q.done)) return false; return !settings().target||kbjuOk(d) }

  const act=stats.filter(s=>s.done>0||peekDay(s.k)); const best=act.length?act.reduce((a,b)=>b.p>a.p?b:a):null, worst=act.length?act.reduce((a,b)=>b.p<a.p?b:a):null;
  const avg=act.length?act.reduce((a,s)=>a+s.p,0)/act.length:0; const g=w.goals||[], gd=g.filter(x=>x.done).length; const tk=todayKey();

  <div class="grid3"><div class="kpi"><span class="v">${allT}</span><span class="l">Всего задач</span></div><div class="kpi"><span class="v">${doneT}</span><span class="l">Выполнено</span></div><div class="kpi"><span class="v">${allT-doneT}</span><span class="l">Осталось</span></div>
   <div class="kpi"><span class="v">${best?WDS[wdIdx(best.k)]:"—"}</span><span class="l">Лучший день</span></div><div class="kpi"><span class="v">${worst?WDS[wdIdx(worst.k)]:"—"}</span><span class="l">Худший день</span></div><div class="kpi"><span class="v">${Math.round(avg*100)}%</span><span class="l">Средний %</span></div></div>
  <section class="card"><div class="row between" style="align-items:center"><div><h2>Цели на неделю</h2><div class="small muted">Выполнено ${gd} из ${g.length}</div></div>${ring(g.length?gd/g.length:0,60)}</div>
   <div>${g.map(x=>`<div class="check ${x.done?"done":""}">${box(x.done,`data-a="goal" data-w="${wk}" data-id="${x.id}" aria-label="${esc(x.text)}"`)}<span class="txt">${esc(x.text)}</span><button class="x" data-a="delGoal" data-w="${wk}" data-id="${x.id}" aria-label="Удалить">×</button></div>`).join("")||'<div class="empty">Запиши до пяти целей на эту неделю</div>'}</div>
   <div class="add"><input id="add-goal-${wk}" placeholder="Новая цель" data-enter="addGoal" data-w="${wk}" autocomplete="off"><button data-a="addGoal" data-w="${wk}">Добавить</button></div></section>
  ${settings().habits.length?`<section class="card"><h2>Привычки за 30 дней</h2>${settings().habits.map(h=>{const ks=[...Array(30)].map((_,i)=>ymd(addDays(new Date(),i-29))); const on=ks.filter(k=>peekDay(k)?.habits?.[h.id]).length, n=streak(h.id);
     return `<div class="stack" style="gap:4px"><div class="row between small"><b>${esc(h.name)}</b><span class="muted">${n?`серия ${n} дн. · `:""}${on} из 30</span></div><div class="heat" aria-label="${esc(h.name)}: ${on} из 30 дней">${ks.map(k=>`<i class="${peekDay(k)?.habits?.[h.id]?"on":""}" title="${fmtDs(k)}"></i>`).join("")}</div></div>`}).join("")}</section>`:""}

    <div class="dayhd"><h3 class="${k===tk?"today-mark":""}">${WD[wdIdx(k)]}</h3><span class="small muted">${fmtDs(k)} · ${s.done}/${s.total}</span></div>
    <div>${(d.tasks||[]).map(x=>`<div class="check ${x.done?"done":""}">${box(x.done,`data-a="task" data-day="${k}" data-id="${x.id}" aria-label="${esc(x.text)}"`)}<span class="txt">${esc(x.text)}${x.rid?' <span class="chip">повтор</span>':""}</span>${x.done?"":`<button class="btn-sm" data-a="moveTask" data-day="${k}" data-id="${x.id}" aria-label="Перенести «${esc(x.text)}» на завтра">→ завтра</button>`}<button class="x" data-a="delTask" data-day="${k}" data-id="${x.id}" aria-label="Удалить">×</button></div>`).join("")}</div>
    <div class="add"><input id="add-task-${k}" placeholder="Задача" data-enter="addTask" data-day="${k}" autocomplete="off"><button class="btn-sm" data-a="addTask" data-day="${k}">+</button></div>
    <div class="row between"><div class="state-row"><span>Сон ${fmtSleep(d.sleep)}</span><span>${d.energy?"⚡".repeat(d.energy):"⚡—"}</span><span>${d.mood?MOODS[d.mood-1]:"—"}</span>${trainDays.has(k)?'<span class="chip acc">тренировка</span>':""}</div><button class="btn-ghost btn-sm" data-a="openDay" data-day="${k}">День ›</button></div>

/* --- Тренировка --- */

    <div class="row between"><h2>${esc(progName(p))}</h2>${p.id===np?'<span class="chip acc">следующая</span>':""}</div><div class="small muted">${p.src} · ${p.scheme}</div>
    <div class="small">${p.items.map(i=>exName(i.ex)).join(" · ")}</div><div class="small muted">Разминка: 10 мин эллипс · Кардио 15 мин · Заминка</div></div></div>

  ${cps.length?`<h2>Свои программы</h2>${cps.map(p=>`<section class="card"><div class="row" style="align-items:stretch"><span class="plate p-X"></span><div class="grow"><h3>${esc(p.n)}</h3><div class="small muted">${p.items.map(i=>exName(i.ex)).join(" · ")}</div></div></div><div class="row"><button class="grow" data-a="startP" data-id="${p.id}">Начать</button><button class="btn-sm" data-a="renameOpen" data-k="p" data-id="${p.id}">Переименовать</button><button class="btn-sm btn-danger" data-a="delProg" data-id="${p.id}">Удалить</button></div></section>`).join("")}`:""}
  <button data-a="startEmpty">Пустая тренировка — набрать упражнения самому</button>
  <section class="card"><h2>История</h2>${hist.length?hist.slice(0,UI.histAll?60:5).map(w=>`<button class="pick" data-a="openW" data-id="${w.id}"><span><b>${esc(w.title)}</b><br><span class="small muted">${fmtD(w.date)} · ${w.ex.length} упр. · ${wSets(w)} подх.${w.ex.some(e=>e.ss)?" · суперсерии":""}</span></span><span class="num">${fmtN(wVolume(w)/1000)} т</span></button>`).join("")+(hist.length>5&&!UI.histAll?`<button class="btn-ghost btn-sm" style="align-self:flex-start" data-a="histAll">Показать все (${hist.length})</button>`:""):'<div class="empty">Здесь появятся завершённые тренировки</div>'}</section>`;
}
function vLogger(id){
  const w=S.workouts[id]; const fin=!!w.finishedAt; const el=fin?((w.finishedAt-(w.startedAt||w.finishedAt))/1000):((Date.now()-w.startedAt)/1000);
  const cardioSel=w.cardio?.type||"";
  return `<header class="row between"><div class="grow"><div class="eyebrow">${fin?"Завершена · "+fmtD(w.date):"Идёт тренировка"}</div><h1>${esc(w.title)}</h1><button class="btn-ghost btn-sm" style="padding-left:0" data-a="renameOpen" data-k="w" data-id="${id}">Переименовать</button></div>
    <div class="stack" style="align-items:flex-end;gap:4px"><span class="num" style="font-size:22px" id="wk-el">${mmss(el)}</span>${fin?`<button class="btn-sm" data-a="closeW">К списку</button>`:""}</div></header>
  ${fin?`<div class="grid3"><div class="kpi"><span class="v">${wSets(w)}</span><span class="l">Подходов</span></div><div class="kpi"><span class="v">${fmtN(wVolume(w)/1000)}</span><span class="l">Объём, т</span></div><div class="kpi"><span class="v">${w.ex.filter(e=>doneSets(e).length).length}/${w.ex.length}</span><span class="l">Упражнений</span></div></div>`:""}

  ${vExList(id,w)}
  <button data-a="sheet" data-v="pick">+ Добавить упражнение</button>
  <section class="card"><div class="row between"><h2>Кардио 15 мин</h2>${box(w.cardio?.done,`data-a="cardioDone" data-id="${id}" aria-label="Кардио выполнено"`)}</div>
    <div class="stack">${CARDIO.map(c=>`<button class="pick" data-a="cardio" data-id="${id}" data-v="${c.id}" aria-pressed="${cardioSel===c.id}" style="${cardioSel===c.id?"outline:2px solid var(--hl)":""}"><span><b>${c.n}</b><br><span class="small muted">${c.d}</span></span></button>`).join("")}</div>
    <label class="field">Минут<input id="cardio-min-${id}" type="number" inputmode="numeric" value="${esc(w.cardio?.min??15)}" data-c="cardioMin" data-id="${id}"></label></section>
  <section class="card"><div class="check ${w.stretch?"done":""}">${box(w.stretch,`data-a="wFlag" data-id="${id}" data-f="stretch" aria-label="Заминка"`)}<span class="txt">Заминка и растяжка</span></div>
    <label class="field">Заметка к тренировке<textarea id="wnote-${id}" data-i="wNote" data-id="${id}" placeholder="Самочувствие, что поменять в следующий раз">${esc(w.note||"")}</textarea></label></section>
  <div class="stack">${fin?`<div class="row"><button class="grow" data-a="reportPreview" data-id="${id}">Отчёт для сториз</button><button class="grow" data-a="reportPreview" data-id="${id}" data-kind="overlay">PNG для видео</button></div><button data-a="saveProg" data-id="${id}">Сохранить как свою программу</button><button class="btn-danger" data-a="sheet" data-v="delW">Удалить тренировку</button>`:

}
function vExList(id,w){ let n=0,out=""; for(let i=0;i<w.ex.length;i++){ const e=w.ex[i], p=partner(w,e); n++;
    if(p&&w.ex[i+1]===p){ const ga=EX[e.exId]?.g, gb=EX[p.exId]?.g;
      out+=`<div class="ss"><div class="row between"><span class="eyebrow" style="color:var(--hl)">Суперсерия · ${ga}${ga!==gb?" + "+gb:""}</span>${w.finishedAt?"":`<button class="btn-ghost btn-sm" data-a="ssBreak" data-id="${id}" data-e="${e.id}">Разорвать</button>`}</div>
        <p class="small muted" style="margin:0">По очереди: ${n}A → ${n}Б → отдых, и так каждый подход</p>${vExercise(id,w,e,n+"A")}${vExercise(id,w,p,n+"Б")}</div>`; i++ }
    else out+=vExercise(id,w,e,String(n)) }
  return out }
function vExercise(id,w,e,i){
  const prev=prevFor(e.exId,id); const cur=topOf(e.exId,doneSets(e)), pt=prev?topOf(e.exId,prev.sets):null;
  const diff=cur&&pt&&cur.u===pt.u?cur.v-pt.v:null, du=cur?.u; const bw=EX[e.exId]?.bw; const wc=workCur(e.exId), wu=workUnit(e.exId); const better=diff!=null&&(EX[e.exId]?.assist?diff<0:diff>0);
  const B=bests(id)[e.exId], pr=e.sets.some(x=>isPR(e.exId,x,B));
  return `<section class="card"><div class="ex-head"><span class="ex-n">${i}</span><div class="grow stack" style="gap:3px">
    <button class="btn-ghost" style="padding:0;justify-content:flex-start;text-align:left;color:var(--ink)" data-a="sheet" data-v="info" data-ex="${e.exId}"><h3>${esc(exName(e.exId))}</h3></button>
    <div class="row small muted"><span>${e.sets.length} × ${esc(e.target||"—")}</span><span>${(()=>{const p=partner(w,e); if(p&&w.ex.indexOf(e)<w.ex.indexOf(p)) return "· без отдыха, сразу ко второму"; const r=p?Math.max(e.rest||120,p.rest||120):e.rest; return "· отдых "+(p?"после пары ":"")+(r>=60?Math.round(r/60*10)/10+" мин":r+" с")})()}</span>${e.note?`<span>· ${esc(e.note)}</span>`:""}${diff!=null?`<span class="chip ${better?"up":diff?"down":""}">${diff>0?"+":""}${fmtN(diff)}${unitTxt(du)} к прошлому</span>`:""}${!prev&&wc!=null?`<span class="chip">${wu==="повт."?"лучший подход":"рабочий"} ${fmtN(wc)}${unitTxt(wu)}</span>`:""}${EX[e.exId]?.assist?`<span class="chip">противовес</span>`:""}${bw?`<span class="chip">свой вес</span>`:""}${!w.finishedAt&&!w.deload&&stalled(e.exId)?`<span class="chip down">Застой: 3 тренировки без роста</span>`:""}${e.hint&&!w.finishedAt?`<span class="chip up">Пора прибавить: +${fmtN(e.hint)} кг</span>`:""}${pr?`<span class="chip up">Рекорд!</span>`:""}</div></div></div>

   <div class="kpi"><span class="v">${sleeps.length?fmtN(sleeps.reduce((x,y)=>x+y,0)/sleeps.length)+" ч":"—"}</span><span class="l">Средний сон</span></div></div>

// Итоги тренировки для наложения на видео: широкая низкая плашка 1600 px на прозрачном фоне, по размеру содержимого.
// Упражнения в две колонки. style: "panel" — тёмная полупрозрачная подложка, "clean" — только текст с тенью
async function overlayImage(R,o){ try{ await Promise.all(['600 110px Oswald','500 40px "Golos Text"','600 40px "Golos Text"'].map(f=>document.fonts.load(f))) }catch(e){}
  const panel=o.style!=="clean", rows=R.rows.slice(0,8), more=R.rows.length-rows.length, perCol=Math.ceil(rows.length/2), rowH=68, PAD=56;
  const W=1600, headH=150, kpiH=130, H=PAD+headH+kpiH+24+Math.max(1,perCol)*rowH+(more?44:0)+PAD-10;
  const c=document.createElement("canvas"); c.width=W; c.height=H; const g=c.getContext("2d"); const LIME="#D8FD3E",WHITE="#FFFFFF",SOFT="rgba(255,255,255,.78)";
  const rr=(x,y,w,h,r)=>{ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath() };
  const fit=(t,max)=>{ if(g.measureText(t).width<=max) return t; while(t.length>1&&g.measureText(t+"…").width>max) t=t.slice(0,-1); return t+"…" };
  if(panel){ rr(6,6,W-12,H-12,48); g.fillStyle="rgba(5,5,5,.62)"; g.fill() }
  else { g.shadowColor="rgba(0,0,0,.75)"; g.shadowBlur=22; g.shadowOffsetY=3 }
  const L=PAD+14, Rr=W-PAD-14; let y=PAD+30;
  try{ g.letterSpacing="6px" }catch(e){} g.fillStyle=LIME; g.font='600 30px "Golos Text",sans-serif'; g.fillText("KALASHNIKOV",L,y); try{ g.letterSpacing="0px" }catch(e){}
  g.fillStyle=SOFT; g.font='500 30px "Golos Text",sans-serif'; g.textAlign="right"; g.fillText(R.date,Rr,y); g.textAlign="left";
  const title=(/^тренировка/i.test(R.title)?R.title:"Тренировка "+R.title).toUpperCase(); let fs=96; for(;fs>52;fs-=4){ g.font=`600 ${fs}px Oswald,Impact,sans-serif`; if(g.measureText(title).width<=Rr-L) break }
  y+=fs+12; g.fillStyle=WHITE; g.fillText(fit(title,Rr-L),L,y);
  y=PAD+headH; const cw=(Rr-L)/3;
  [[R.min,"минут"],[R.sets,"подходов"],[fmtN(R.vol),"тонн объём"]].forEach(([v,l],i)=>{ const x=L+i*cw; const sh=g.shadowColor; if(i){ g.shadowColor="transparent"; g.fillStyle="rgba(216,253,62,.6)"; g.fillRect(x-1,y+10,3,100); g.shadowColor=sh }
    const tx=x+(i?28:0); g.fillStyle=WHITE; g.font='600 92px Oswald,Impact,sans-serif'; g.fillText(String(v),tx,y+90); const vw=g.measureText(String(v)).width; g.fillStyle=SOFT; g.font='500 30px "Golos Text",sans-serif'; g.fillText(l,tx+vw+16,y+90) });
  y+=kpiH+24; const colW=(Rr-L-60)/2;
  rows.forEach((r,idx)=>{ const col=idx<perCol?0:1, ry=y+(idx%perCol)*rowH, x0=L+col*(colW+60), right=x0+colW;
    g.font='600 38px Oswald,Impact,sans-serif'; g.textAlign="right"; let rx=right; const dl=r.delta?r.delta.replace(" повт.",""):"";
    if(dl){ g.fillStyle=r.up?LIME:SOFT; g.fillText(dl,rx,ry+44); rx-=g.measureText(dl).width+18 }
    const top2=r.top||String(r.sets).split("·")[0].trim(); g.fillStyle=WHITE; g.fillText(top2,rx,ry+44); rx-=g.measureText(top2).width+22; g.textAlign="left";
    g.fillStyle=r.pr?LIME:WHITE; g.font='600 34px "Golos Text",sans-serif'; g.fillText(fit((r.pr?"★ ":"")+r.n,rx-x0),x0,ry+44) });
  if(more){ g.fillStyle=SOFT; g.font='500 28px "Golos Text",sans-serif'; g.fillText(`и ещё ${more} ${plural(more,"упражнение","упражнения","упражнений")}`,L,y+perCol*rowH+30) }
  return new Promise(res=>c.toBlob(res,"image/png")) }

  const step=t=>{ const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3); for(const el of els){ const v=+el.dataset.count*e; el.textContent=(el.dataset.plus?"+":"")+(el.dataset.dec?fmtN(Math.round(v*10)/10):Math.round(v)) } if(k<1) requestAnimationFrame(step) };
  try{ if(matchMedia("(prefers-reduced-motion: reduce)").matches){ step(t0+dur); return } }catch(e){} requestAnimationFrame(step) }

/* --- таймер отдыха --- */
function renderRest(){
  const el=$("#rest"); const left=(rest.end-Date.now())/1000;
  if(!rest.end||left<=-3){ el.innerHTML=""; return }
  el.innerHTML=`<div class="restbar"><div class="in"><span class="t">${left>0?mmss(left):"Пора!"}</span><div class="bar"><i style="width:${Math.max(0,left/rest.total*100)}%"></i></div><button class="btn-sm" data-a="restAdd">+30</button><button class="btn-sm" data-a="restStop">Стоп</button></div></div>`;
}
function startRest(sec,label){ rest.total=sec; rest.end=Date.now()+sec*1000; rest.beeped=false; rest.label=label||""; renderRest() }
// Проверка обновлений: номер сборки подставляет build.py, на сайте рядом лежит version.txt
const APP_VER="1794161898";
async function checkUpdate(manual){ if(APP_VER.startsWith("__")){ if(manual) toast("Проверка обновлений работает в версии с сайта"); return false }
  try{ const v=(await (await fetch("version.txt?t="+Date.now(),{cache:"no-store"})).text()).trim(); if(/^\d+$/.test(v)&&v!==APP_VER&&+v>+APP_VER){ UI.newVer=true; render(); return true } if(manual) toast("У тебя последняя версия") }
  catch(e){ if(manual) toast("Нет связи. Проверь интернет и попробуй снова.") } return false }
async function hardUpdate(){ try{ const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); const regs=await navigator.serviceWorker?.getRegistrations(); await Promise.all((regs||[]).map(r=>r.update().catch(()=>{}))) }catch(e){} location.reload() }
const TG={get(){ try{ return JSON.parse(localStorage.getItem("zh_tg")||"{}") }catch(e){ return {} } }, set(v){ try{ localStorage.setItem("zh_tg",JSON.stringify(v)) }catch(e){} }};
// POST с form-urlencoded — «простой» запрос без предварительной проверки CORS, Telegram его принимает
async function tgCall(token,method,params){ const r=await fetch("https://api.telegram.org/bot"+token+"/"+method,{method:"POST",body:new URLSearchParams(params||{})}); return r.json() }
async function tgSend(text){ const t=TG.get(); if(!t.on||!t.token||!t.chat) return false; try{ return (await tgCall(t.token,"sendMessage",{chat_id:t.chat,text})).ok }catch(e){ return false } }
function beep(){ try{ if(!audioCtx) return; const o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.frequency.value=880; g.gain.setValueAtTime(.2,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.6); o.connect(g).connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+.6) }catch(e){} try{navigator.vibrate?.([200,100,200])}catch(e){} }
setInterval(()=>{
  if(rest.end){ const left=(rest.end-Date.now())/1000; if(left<=0&&!rest.beeped){ rest.beeped=true; beep(); const msg=rest.label?"Следующий подход: "+rest.label:"Пора на следующий подход"; tgSend("Отдых окончен. "+msg) } if(left<=-3){ rest.end=0 } renderRest() }
  const el=document.getElementById("wk-el"); const id=UI.openWorkout||activeWorkout(); const w=id&&S.workouts[id]; if(el&&w&&!w.finishedAt) el.textContent=mmss((Date.now()-w.startedAt)/1000);
},1000);

/* ---------- действия ---------- */
function toast(t){ const d=document.createElement("div"); d.className="toast"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),3200) }
function findEx(d){ const w=S.workouts[d.id]; return [w,w?.ex.find(e=>e.id===d.e)] }
const SS_RULES=[["Грудь","Спина"],["Плечи","Ноги"],["Бицепс","Трицепс"]];
function partner(w,e){ return e.ss?w.ex.find(x=>x.ss===e.ss&&x.id!==e.id):null }
function orderPairs(w){ const out=[],seen=new Set(); for(const e of w.ex){ if(seen.has(e.id)) continue; out.push(e); seen.add(e.id); const p=partner(w,e); if(p&&!seen.has(p.id)){ out.push(p); seen.add(p.id) } } w.ex=out }
// Пары по схеме: грудь+спина, плечи+ноги, бицепс+трицепс. Из ног берём последнее упражнение, чтобы пара шла после остальных ног.
function autoPair(w){ const free=g=>w.ex.filter(e=>!e.ss&&EX[e.exId]?.g===g);
  for(const [a,b] of SS_RULES){ const A=free(a)[0], Bs=free(b), B=b==="Ноги"?Bs[Bs.length-1]:Bs[0]; if(A&&B){ const sid="s"+uid(); A.ss=sid; B.ss=sid } }
  orderPairs(w) }
const progName=p=>settings().progNames?.[p.id]||p.n;
function newWorkout(title,programId,items){
  const id="w"+Date.now().toString(36); const w={date:todayKey(),title,programId:programId||null,startedAt:Date.now(),finishedAt:null,warmup:false,stretch:false,cardio:{type:"",min:15,done:false},note:"",ex:[]};
  S.workouts[id]=w; for(const it of items) w.ex.push(makeEx(id,it)); save("workouts",id); UI.openWorkout=id; UI.tab="train"; keepAwake(); scrollTo(0,0);
}
function makeEx(wid,it){ const prev=prevFor(it.ex,wid); const n=it.sets||4; const hint=progressHint(it.ex,it.reps,prev);
  return {id:uid(),exId:it.ex,target:it.reps||"",rest:it.rest||120,alt:it.alt||[],note:it.note||"",...(it.ss?{ss:it.ss}:{}),...(hint?{hint:hint.add}:{}),
    sets:[...Array(n)].map((_,j)=>({w:hint?hint.w:(prev?.sets[j]?.w??prev?.sets[prev.sets.length-1]?.w??(workUnit(it.ex)==="кг"?workCur(it.ex):null)??""),r:"",done:false}))} }

  habitPart:d=>{const k=UI.day,x=day(k), h=settings().habits.find(h=>h.id===d.id); if(!h) return; const a=hpOf(x,h); a[+d.i]=!a[+d.i]; x.hp={...(x.hp||{}),[h.id]:a}; x.habits={...(x.habits||{}),[h.id]:a.every(Boolean)}; saveDay(k); if(a.every(Boolean)) toast(h.name+": всё выполнено")},

  if(!ac||S.meta.settings.gm.accent==="lime"){ ["--accent","--hl","--accent-soft","--glow","--green","--green-soft"].forEach(v=>st.removeProperty(v)); return }
  const hl=light?ac.hlL:ac.a; st.setProperty("--accent",ac.a); st.setProperty("--hl",hl); st.setProperty("--green",hl); st.setProperty("--accent-soft",hexA(ac.a,.14)); st.setProperty("--green-soft",hexA(ac.a,.16)); st.setProperty("--glow",hexA(ac.a,light?.22:.12)) }
try{ matchMedia("(prefers-color-scheme: light)").addEventListener("change",applyTheme) }catch(e){}
window.addEventListener("hashchange",()=>{ const h=location.hash.slice(1); if(h==="week"){ UI.tab="today"; UI.todayMode="week"; render() } else if(TABS.some(t=>t[0]===h)){UI.tab=h; render()} });

/* ---------- запуск ---------- */
async function boot(){
  const h=location.hash.slice(1); if(h==="week"){ UI.tab="today"; UI.todayMode="week" } else if(TABS.some(t=>t[0]===h)) UI.tab=h;
  const C=window.claude; let db=null,user=null;
  if(C&&C.use){ [db,user]=await Promise.all([C.use("db"),C.use("user")]) }
  if(user){ let own=true; try{ own=await user.isOwner() }catch(e){} if(!own){ Store.mode="locked"; $("#tabs").innerHTML=""; $("#app").innerHTML='<div class="lock"><div class="stack"><h1>Личное приложение</h1><p class="muted">Это приложение работает только для своего владельца.</p></div></div>'; return } }
  if(db){
    Store.mode="db"; Store.db=db;
    C.use("assets").then(a=>{Store.assets=a; scheduleRender()}); C.use("downloads").then(a=>{Store.downloads=a; scheduleRender()});
    setTimeout(()=>{ if(!Store.loaded.size) render() },2500);
    for(const c of COLLS){
      db.collection(c).onSnapshot(snap=>{ let ch=false;
        for(const x of snap.docChanges()){ const id=x.doc.id; if(Store.pending.has(c+"/"+id)) continue;
          if(x.type==="removed"){ if(S[c][id]){ delete S[c][id]; ch=true } continue }
          const js=JSON.stringify(x.doc.data()); if(JSON.stringify(S[c][id])!==js){ S[c][id]=JSON.parse(js); ch=true } }
        const first=!Store.loaded.has(c); Store.loaded.add(c); if(c==="meta") applyTheme(); if(ch||first) scheduleRender();
      },err=>toast("Нет связи с хранилищем: "+(err?.code||"ошибка")+". Обнови страницу."));
    }
  } else {
    Store.mode="local"; try{ navigator.storage?.persist?.() }catch(e){} for(const c of COLLS){ try{ const v=localStorage.getItem("zh_"+c); if(v) S[c]=JSON.parse(v) }catch(e){} } applyTheme(); migrate(); render(); applyFreezes(); setTimeout(()=>checkUpdate(false),1500); setTimeout(()=>tgBackup(false).then(()=>tgWeekly(false)),3000);
  }
}
boot();
</script>
