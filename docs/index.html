<script>
// Запущено с экрана «Домой» как приложение — запрещаем зум (щипок, двойной тап, автозум полей).
if (matchMedia("(display-mode: standalone)").matches || navigator.standalone) {
  document.querySelector('meta[name=viewport]').setAttribute("content", "width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover");
  document.documentElement.style.touchAction = "pan-x pan-y";
  ["gesturestart", "gesturechange", "gestureend"].forEach(t => document.addEventListener(t, e => e.preventDefault(), {passive: false}));
  document.addEventListener("touchmove", e => { if (e.touches.length > 1) e.preventDefault() }, {passive: false});
  let lastTap = 0;
  document.addEventListener("touchend", e => { const now = Date.now(); if (now - lastTap < 300 && !e.target.closest("input,textarea,select")) e.preventDefault(); lastTap = now }, {passive: false});
}
</script>

<style>
/* Layout: one phone-width column, cards by role, fixed tab bar at the bottom. Palette from GYMbro: one dark look — ink black, bone, lime. */
:root{
  --bg:#050505; --surface:#121212; --surface2:#1C1C1B; --ink:#EEEAE1; --muted:#8D8D87; --line:rgba(238,234,225,.16);
  --accent:#D8FD3E; --accent-ink:#050505; --accent-soft:rgba(216,253,62,.12);
  --red:#F18B8B; --yellow:#EEEAE1; --green:#D8FD3E; --red-soft:#39191C; --green-soft:rgba(216,253,62,.14);
  --f-display:"Oswald","Arial Narrow",Impact,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px; color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:radial-gradient(circle at 92% 0,rgba(216,253,62,.12),transparent 25%) fixed,var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#app{max-width:640px;margin:0 auto;padding-block:12px 24px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:28px;line-height:1.1;text-transform:uppercase}
h2{font-size:19px;text-transform:uppercase}
h3{font-size:16px}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.flat{background:transparent;padding:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
button,.btn{font:inherit;color:inherit;cursor:pointer;border:0;background:var(--surface2);border-radius:10px;padding:9px 12px;font-weight:500;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-primary{background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn-ghost{background:transparent;color:var(--accent);padding:6px 8px}
.btn-sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn-danger{background:var(--red-soft);color:var(--red)}
.icon-btn{width:34px;height:34px;padding:0;border-radius:9px;flex:none}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface2);border:1px solid transparent;border-radius:10px;padding:9px 10px;min-width:0;width:100%}
textarea{resize:vertical;min-height:60px}
input[type=number]{font-variant-numeric:tabular-nums}
label.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.seg{display:flex;background:var(--surface2);border-radius:11px;padding:3px;gap:2px}
.seg button{flex:1;background:transparent;padding:7px 6px;font-size:13px;border-radius:8px}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;background:var(--surface2);font-size:12px;font-weight:500}
.chip.up{background:var(--green-soft);color:var(--green)} .chip.down{background:var(--red-soft);color:var(--red)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
button.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
/* checklist */
.check{display:flex;align-items:center;gap:10px;padding:7px 2px;border-bottom:1px solid var(--line);min-width:0}
.check:last-child{border-bottom:0}
.box{width:24px;height:24px;flex:none;border-radius:7px;border:2px solid var(--line);background:transparent;padding:0;display:grid;place-items:center;color:var(--accent-ink)}
.box[aria-checked=true]{background:var(--accent);border-color:var(--accent)}
.box svg{width:14px;height:14px;opacity:0}
.box[aria-checked=true] svg{opacity:1}
.check .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.check.done .txt{color:var(--muted);text-decoration:line-through}
.x{background:transparent;color:var(--muted);padding:4px 6px;font-size:18px;line-height:1}
.add{display:flex;gap:6px}
.add input{flex:1}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:transparent;flex-direction:column;gap:2px;padding:8px 2px 9px;font-size:11px;color:var(--muted);border-radius:0}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current=page]{color:var(--accent);font-weight:600}
/* kpi */
.kpi{background:var(--surface);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .v{font-family:var(--f-display);font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
/* plate stripe: a program's color */
.plate{width:8px;align-self:stretch;border-radius:4px;flex:none}
.p-A{background:var(--red)} .p-B{background:var(--accent)} .p-C{background:var(--yellow)} .p-X{background:var(--muted)}
/* workout logger */
.ex-head{display:flex;gap:10px;align-items:flex-start}
.ex-n{font-family:var(--f-display);font-size:22px;color:var(--muted);width:24px;flex:none;line-height:1.1}
.sets{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) minmax(0,1.1fr) 40px;gap:6px;align-items:center}
.sets .h{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sets input{padding:8px 6px;text-align:center}
.sets .prev{font-size:12px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.sets .sn{font-family:var(--f-display);color:var(--muted);text-align:center}
.sets .box{width:36px;height:36px;border-radius:10px}
.sets input.done{background:var(--green-soft)}
.restbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:19;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.restbar .in{max-width:640px;margin:0 auto 8px;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.restbar .t{font-family:var(--f-display);font-size:26px;font-variant-numeric:tabular-nums;min-width:70px}
.restbar button{background:rgba(127,127,127,.25);color:inherit}
.restbar .bar{flex:1;height:6px;border-radius:3px;background:rgba(127,127,127,.3);overflow:hidden}
.restbar .bar i{display:block;height:100%;background:var(--bg)}
/* sheet */
.sheet-bg{position:fixed;inset:0;z-index:30;background:rgba(5,8,12,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:86vh;overflow:auto;border-radius:18px 18px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.pick{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;background:var(--surface);border-radius:10px;text-align:left;width:100%}
/* table */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
tr.sel td{background:var(--accent-soft)}
tr[data-a]{cursor:pointer}
/* days */
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.dayhd{display:flex;justify-content:space-between;align-items:baseline}
.today-mark{color:var(--accent)}
.state-row{display:flex;gap:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.pickrow{display:flex;gap:6px;flex-wrap:wrap}
.pickrow button{min-width:40px;padding:7px 9px}
.pickrow button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.meter{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:4px}
.meter.over i{background:var(--red)}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.banner{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13px}
.empty{padding:16px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:12px;font-size:14px}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px)}
.photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.photos figure{margin:0;display:flex;flex-direction:column;gap:4px}
.photos img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:var(--surface2)}
.thumbs{display:flex;gap:6px;overflow-x:auto}
.thumbs img{width:64px;height:84px;object-fit:cover;border-radius:8px;flex:none}
.chat{display:flex;flex-direction:column;gap:8px}
.msg{padding:10px 12px;border-radius:12px;max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.msg.ai{align-self:flex-start;background:var(--surface)}
details.art{background:var(--surface);border-radius:12px;padding:12px 14px}
details.art summary{cursor:pointer;font-weight:600}
details.art p,details.art li{color:var(--ink);max-width:65ch}
.menu{display:flex;flex-direction:column;gap:6px}
.lock{min-height:60vh;display:grid;place-items:center;text-align:center}
@media (max-width:420px){ h1{font-size:24px} .kpi .v{font-size:21px} }
@media (prefers-reduced-motion:no-preference){ .box,.seg button{transition:background .15s} }
</style>

function niceTicks(mn,mx){ const span=mx-mn||1; const step=Math.pow(10,Math.floor(Math.log10(span/3))); const m=[1,2,2.5,5,10].find(m=>span/(m*step)<=4)*step; const a=Math.floor(mn/m)*m,b=Math.ceil(mx/m)*m; const t=[];for(let v=a;v<=b+1e-9;v+=m)t.push(r1(v));return t }

  const x=i=>pts.length===1?(pl+(W-pl-pr)/2):pl+i*(W-pl-pr)/(pts.length-1);

  let g=ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(t)+3}" text-anchor="end">${fmtN(t)}</text>`).join("");
  const line=pts.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(p.v).toFixed(1)).join(" ");
  const area=line+` L${x(pts.length-1).toFixed(1)} ${H-pb} L${x(0).toFixed(1)} ${H-pb} Z`;
  const lab=[0,Math.floor((pts.length-1)/2),pts.length-1].filter((v,i,a)=>a.indexOf(v)===i);
  g+=lab.map(i=>`<text x="${x(i)}" y="${H-6}" text-anchor="${i===0&&pts.length>1?"start":i===pts.length-1&&pts.length>1?"end":"middle"}">${esc(pts[i].l)}</text>`).join("");
  const last=pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="График"><path d="${area}" fill="${color}" opacity=".12"/><path d="${line}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round"/>${g}
  ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="${i===pts.length-1?4.5:2.5}" fill="${color}"/>`).join("")}
  <text x="${Math.min(x(pts.length-1),W-pr)}" y="${y(last.v)-9}" text-anchor="end" style="fill:var(--ink);font-weight:600;font-size:11px">${fmtN(last.v)}${unit}</text></svg>`;
}
function barChart(items,{h=150,fmt=v=>fmtN(v),max=null,color="var(--accent)"}={}){
  const W=340,H=h,pl=6,pr=6,pt=18,pb=22; const mx=max??Math.max(1,...items.map(i=>i.v)); const n=items.length; const bw=(W-pl-pr)/n;

function ring(p,size=64,label){ const r=size/2-6,c=2*Math.PI*r; return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${Math.round(p*100)}%"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface2)" stroke-width="7"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--accent)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c*p} ${c}" transform="rotate(-90 ${size/2} ${size/2})"/><text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle" style="fill:var(--ink);font-family:var(--f-display);font-size:${size/4.2}px">${label??Math.round(p*100)+"%"}</text></svg>` }

/* ---------- расчёты ---------- */
function dayStats(k){ const d=peekDay(k); const hab=settings().habits; if(!d) return {total:hab.length,done:0};
  const total=d.tasks.length+hab.length; const done=d.tasks.filter(t=>t.done).length+hab.filter(h=>d.habits?.[h.id]).length; return {total,done} }
function finished(){ return Object.entries(S.workouts).filter(([,w])=>w.finishedAt).map(([id,w])=>({id,...w})).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.startedAt||0)-(b.startedAt||0)) }
function activeWorkout(){ const e=Object.entries(S.workouts).find(([,w])=>!w.finishedAt); return e?e[0]:null }
function doneSets(e){ return e.sets.filter(s=>s.done && (num(s.w)>0 || num(s.r)>0)) }
function wVolume(w){ return w.ex.reduce((a,e)=>a+doneSets(e).reduce((b,s)=>b+num(s.w)*num(s.r),0),0) }
function wSets(w){ return w.ex.reduce((a,e)=>a+doneSets(e).length,0) }
function prevFor(exId,curId){ const cur=S.workouts[curId]; const list=finished().filter(w=>w.id!==curId && (!cur||w.date<=cur.date)).reverse();
  for(const w of list){ const e=w.ex.find(e=>e.exId===exId && doneSets(e).length); if(e) return {date:w.date,sets:doneSets(e)} } return null }
function nextProgram(){ const f=finished().filter(w=>w.programId&&"ABC".includes(w.programId)); if(!f.length) return "A"; const l=f[f.length-1].programId; return {A:"B",B:"C",C:"A"}[l] }
function exStats(from){ const m={}; for(const w of finished()){ if(from&&w.date<from) continue; for(const e of w.ex){ const ds=doneSets(e); if(!ds.length) continue; const t=topOf(e.exId,ds);
  const o=m[e.exId]||(m[e.exId]={id:e.exId,n:0,sets:0,hist:[],u:"кг"}); o.n++; o.sets+=ds.length; if(t){ o.u=t.u; o.hist.push({l:fmtDs(w.date),v:t.v,u:t.u,vals:t.vals}) } } }
  // метрика берётся по последней тренировке: если начал вешать отягощение, считаются только тренировки с ним
  for(const o of Object.values(m)){ const h=o.hist.filter(x=>x.u===o.u); const vals=h.flatMap(x=>x.vals); o.hist=h; o.wsum=vals.reduce((a,b)=>a+b,0); o.wcnt=vals.length; o.max=vals.length?Math.max(...vals):-Infinity; o.min=vals.length?Math.min(...vals):Infinity }
  return Object.values(m).sort((a,b)=>b.n-a.n) }
function periodStart(p,off=0){ const t=new Date(); if(p==="week") return ymd(addDays(monday(t),-7*off)); if(p==="month") return ymd(new Date(t.getFullYear(),t.getMonth()-off,1)); return null }
function periodEnd(p,off=0){ if(p==="all") return null; return off===0?null:periodStart(p,off-1) }
function inRange(k,a,b){ return (!a||k>=a)&&(!b||k<b) }
function mifflin(p){ const w=num(p.weight),h=num(p.height),a=num(p.age); if(!w||!h||!a) return null;
  const bmr=10*w+6.25*h-5*a+(p.sex==="f"?-161:5), tdee=bmr*num(p.activity||1.55); let kcal=tdee, prot, fat;
  if(p.goal==="recomp"){ kcal=tdee-Math.min(tdee*0.1,500); prot=w*2.2; fat=Math.max(w*0.8,kcal*0.25/9) } // обоснование — статья «Рекомпозиция» в базе знаний
  else { kcal*= p.goal==="cut"?0.85:p.goal==="gain"?1.1:1; prot=w*(p.goal==="cut"?2:1.8); fat=w*0.9 }
  const carb=Math.max(0,(kcal-prot*4-fat*9)/4); return {kcal:Math.round(kcal),p:Math.round(prot),f:Math.round(fat),c:Math.round(carb),bmr:Math.round(bmr),tdee:Math.round(tdee)} }
function recompCheck(){
  const from=ymd(addDays(new Date(),-28)); const ents=Object.entries(S.body).filter(([k])=>k>=from).sort((a,b)=>a[0]<b[0]?-1:1);
  const span=m=>{const l=ents.filter(([,e])=>num(e[m])); if(l.length<2) return null; const d=(parseYmd(l[l.length-1][0])-parseYmd(l[0][0]))/864e5; return d>=7?{d:num(l[l.length-1][1][m])-num(l[0][1][m]),start:num(l[0][1][m]),days:d}:null};
  const wt=span("weight"), waist=span("waist");
  const before={},after={}; for(const w of finished()){ for(const e of w.ex){ const t=topOf(e.exId,doneSets(e)); if(!t) continue; const top=EX[e.exId]?.assist?-t.v:t.v, k=e.exId+t.u; const m=w.date>=from?after:before; m[k]=Math.max(m[k]??-Infinity,top) } }
  const both=Object.keys(after).filter(id=>id in before); const up=both.filter(id=>after[id]>before[id]).length;
  let verdict=null; if(wt){ const pct=wt.d/wt.start*100/(wt.days/7); verdict= pct>0.25?{c:"down",t:"Вес растёт быстрее 0,25% в неделю — убери 100–150 ккал из углеводов"}:pct<-0.7?{c:"down",t:"Вес падает быстрее 0,7% в неделю — добавь 100–150 ккал, иначе мышцы расти не будут"}:{c:"up",t:"Темп в норме: вес почти стоит или медленно снижается"} }
  return {wt,waist,up,both:both.length,verdict} }

function vExercise(id,w,e,i){

    <div class="row small muted"><span>${e.sets.length} × ${esc(e.target||"—")}</span><span>· отдых ${e.rest>=60?Math.round(e.rest/60*10)/10+" мин":e.rest+" с"}</span>${e.note?`<span>· ${esc(e.note)}</span>`:""}${diff!=null?`<span class="chip ${better?"up":diff?"down":""}">${diff>0?"+":""}${fmtN(diff)}${unitTxt(du)} к прошлому</span>`:""}${!prev&&wc!=null?`<span class="chip">${wu==="повт."?"лучший подход":"рабочий"} ${fmtN(wc)}${unitTxt(wu)}</span>`:""}${EX[e.exId]?.assist?`<span class="chip">противовес</span>`:""}${bw?`<span class="chip">свой вес</span>`:""}</div></div></div>
    <div class="sets"><span class="h">№</span><span class="h" style="text-align:center">${bw?"доп. кг":"Вес, кг"}</span><span class="h" style="text-align:center">Повт.</span><span class="h" style="text-align:center">Прошлый раз</span><span></span>
    ${e.sets.map((s,j)=>{const p=prev?.sets[j]; return `<span class="sn">${j+1}</span>
      <input id="w-${e.id}-${j}" type="number" inputmode="decimal" step="0.5" value="${esc(s.w)}" placeholder="${p?esc(num(p.w)?p.w:(bw?"0":"")):esc(wu==="кг"?(wc??""):"0")}" data-i="setW" data-id="${id}" data-e="${e.id}" data-j="${j}" aria-label="Вес, подход ${j+1}" ${s.done?'class="done"':""}>
      <input id="r-${e.id}-${j}" type="number" inputmode="numeric" value="${esc(s.r)}" placeholder="${esc((e.target||"").split("–").pop().replace(/\D/g,"")||"")}" data-i="setR" data-id="${id}" data-e="${e.id}" data-j="${j}" aria-label="Повторы, подход ${j+1}">
      <span class="prev">${!p?"—":num(p.w)?(bw?"+":"")+fmtN(num(p.w))+(num(p.r)?" × "+p.r:""):num(p.r)?p.r+" повт.":"—"}</span>
      ${box(s.done,`data-a="setDone" data-id="${id}" data-e="${e.id}" data-j="${j}" aria-label="Подход ${j+1} выполнен"`)}`}).join("")}</div>
    <div class="row"><button class="btn-sm" data-a="addSet" data-id="${id}" data-e="${e.id}">+ подход</button><button class="btn-sm" data-a="delSet" data-id="${id}" data-e="${e.id}" ${e.sets.length<2?"disabled":""}>− подход</button>
     <button class="btn-sm" data-a="sheet" data-v="swap" data-e="${e.id}">Заменить</button><span class="grow"></span>

function vProgress(){

  const sum=(l,f)=>l.reduce((x,w)=>x+f(w),0);
  const dd=(c,p,fmt=fmtN)=>P==="all"?"":`<span class="chip ${c>p?"up":c<p?"down":""}">${c>=p?"+":""}${fmt(c-p)}</span>`;
  const dayKeys=Object.values(S.weeks).flatMap(w=>Object.keys(w.days||{})).filter(k=>inRange(k,a,b)&&k<=todayKey());
  const tasks=dayKeys.reduce((x,k)=>{const s=dayStats(k);return {t:x.t+s.total,d:x.d+s.done}},{t:0,d:0});
  const sleeps=dayKeys.map(k=>num(peekDay(k)?.sleep)).filter(Boolean);
  const all=finished(); const firstD=all[0]?.date; const weeksSpan=firstD?Math.max(1,(Date.now()-parseYmd(firstD))/(7*864e5)):1;
  const vol8=[...Array(8)].map((_,i)=>{const m=ymd(addDays(monday(new Date()),-7*(7-i)));const e=ymd(addDays(parseYmd(m),7));return {l:fmtDs(m),v:r1(sum(all.filter(w=>w.date>=m&&w.date<e),wVolume)/1000),hi:i===7}});

  <div class="seg" role="group" aria-label="Период">${[["week","Неделя"],["month","Месяц"],["all","Всё время"]].map(([v,l])=>`<button aria-pressed="${P===v}" data-a="period" data-v="${v}">${l}</button>`).join("")}</div>
  <div class="grid2"><div class="kpi"><span class="v">${cur.length} ${dd(cur.length,prv.length)}</span><span class="l">Тренировок</span></div>

   <div class="kpi"><span class="v">${fmtN(sum(cur,wVolume)/1000)} ${dd(sum(cur,wVolume)/1000,sum(prv,wVolume)/1000)}</span><span class="l">Объём, тонн</span></div>
   <div class="kpi"><span class="v">${fmtN(all.length/weeksSpan)}</span><span class="l">В среднем в неделю</span></div>
   <div class="kpi"><span class="v">${tasks.t?Math.round(tasks.d/tasks.t*100):0}%</span><span class="l">Дел и привычек</span></div>
   <div class="kpi"><span class="v">${sleeps.length?fmtN(sleeps.reduce((x,y)=>x+y,0)/sleeps.length)+" ч":"—"}</span><span class="l">Средний сон</span></div></div>
  ${P!=="all"?`<p class="small muted" style="margin:0">Цветные метки — разница с прошлым${P==="week"?"й неделей":" месяцем"}.</p>`:""}
  <section class="card"><h2>Объём по неделям, т</h2>${barChart(vol8,{fmt:v=>fmtN(v)})}</section>
  <section class="card"><h2>Упражнения</h2>

   ${st.length?`<div class="tbl-wrap"><table><thead><tr><th>Упражнение</th><th>Раз</th><th>Ср п</th><th>Ср вес</th><th>Макс</th><th>Мин</th></tr></thead><tbody>
   ${st.map(s=>`<tr data-a="progEx" data-v="${s.id}" class="${s.id===sel?"sel":""}"><td>${esc(exName(s.id))}</td><td>${s.n}</td><td>${fmtN(s.sets/s.n)}</td><td>${s.wcnt?fmtN(s.wsum/s.wcnt)+(s.u==="кг"?"":" п"):"—"}</td><td>${s.max>-Infinity?fmtN(s.max)+(s.u==="кг"?"":" п"):"—"}</td><td>${s.min<Infinity?fmtN(s.min)+(s.u==="кг"?"":" п"):"—"}</td></tr>`).join("")}</tbody></table></div><p class="small muted" style="margin:0">Нажми на строку, чтобы увидеть график. «п» — повторы в упражнениях со своим весом.</p>`:'<div class="empty">За этот период тренировок нет</div>'}</section>

  return `<section class="card"><div class="eyebrow" style="color:var(--accent)">Рекомпозиция</div><h2>Как посчитана норма</h2>

}
function startRest(sec){ rest.total=sec; rest.end=Date.now()+sec*1000; rest.beeped=false; renderRest() }
function beep(){ try{ if(!audioCtx) return; const o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.frequency.value=880; g.gain.setValueAtTime(.2,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.6); o.connect(g).connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+.6) }catch(e){} try{navigator.vibrate?.([200,100,200])}catch(e){} }
setInterval(()=>{
  if(rest.end){ const left=(rest.end-Date.now())/1000; if(left<=0&&!rest.beeped){ rest.beeped=true; beep() } if(left<=-3){ rest.end=0 } renderRest() }
  const el=document.getElementById("wk-el"); const id=UI.openWorkout||activeWorkout(); const w=id&&S.workouts[id]; if(el&&w&&!w.finishedAt) el.textContent=mmss((Date.now()-w.startedAt)/1000);
},1000);

  doSwap:d=>{const id=UI.openWorkout||activeWorkout(); const w=S.workouts[id]; const e=w.ex.find(e=>e.id===UI.sheet.e); const old=e.exId; e.exId=d.ex; e.alt=[old,...(e.alt||[]).filter(a=>a!==d.ex)];
    const prev=prevFor(d.ex,id); e.sets=e.sets.map((s,j)=>({w:prev?.sets[j]?.w??"",r:"",done:false})); save("workouts",id); UI.sheet=null},
  delW:()=>{const id=UI.openWorkout||activeWorkout(); remove("workouts",id); UI.openWorkout=null; UI.sheet=null; rest.end=0},
  saveProg:d=>{UI.sheet={type:"saveProg",wid:d.id,name:S.workouts[d.id].title}},
  doSaveProg:()=>{const w=S.workouts[UI.sheet.wid]; const n=(document.getElementById("prog-name")?.value||"").trim()||w.title; const s=settings(); s.customPrograms=s.customPrograms||[];
    s.customPrograms.push({id:"P"+uid(),n,scheme:"своя",items:w.ex.map(e=>({ex:e.exId,sets:e.sets.length,reps:e.target,rest:e.rest,alt:e.alt}))}); save("meta","settings"); UI.sheet=null; toast("Программа сохранена")},
  delProg:d=>{const s=settings(); s.customPrograms=s.customPrograms.filter(p=>p.id!==d.id); save("meta","settings")},
  addWork:d=>{const v=num(document.getElementById("work-in")?.value); if(!v){toast("Впиши число");return} const it=working().items[d.ex]||(working().items[d.ex]={h:[],u:EX[d.ex]?.bw?"повт.":"кг"}); it.h.push(v); save("meta","working")},
  undoWork:d=>{const it=working().items[d.ex]; if(it?.h.length){ it.h.pop(); save("meta","working") }},
  restAdd:()=>{rest.end+=30000; rest.total+=30; rest.beeped=false},
  restStop:()=>{rest.end=0},
  period:d=>{UI.period=d.v}, progEx:d=>{UI.progEx=d.v}, bodyMetric:d=>{UI.bodyMetric=d.v},
  addHabit:()=>{const inp=document.getElementById("add-habit"); const v=inp?.value.trim(); if(!v) return; settings().habits.push({id:"h"+uid(),name:v}); save("meta","settings"); inp.value=""},
  delHabit:d=>{const s=settings(); s.habits=s.habits.filter(h=>h.id!==d.id); save("meta","settings")},
  theme:d=>{settings().theme=d.v; applyTheme(); save("meta","settings")},
  export:async()=>{ const fn="kalashnikov-"+todayKey()+".json", data=JSON.stringify({meta:S.meta,weeks:S.weeks,workouts:S.workouts,body:S.body},null,1);
    if(!Store.downloads){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([data],{type:"application/json"})); a.download=fn; document.body.appendChild(a); a.click(); a.remove(); return false }
    try{ await Store.downloads.save({filename:fn,data}) }catch(e){ if(e?.code!=="declined"&&e?.code!=="cancelled") toast("Не удалось сохранить файл") } return false },
  ask:async d=>{ const q=d.v||document.getElementById("coach-q")?.value.trim(); if(!q||UI.chatBusy||!Store.sample) return false; const ta=document.getElementById("coach-q"); if(ta) ta.value="";
    UI.chat.push({role:"user",text:q}); const ans={role:"ai",text:"Думаю…"}; UI.chat.push(ans); UI.chatBusy=true; render();
    try{ const r=await Store.sample(coachPrompt(q),{cache:false,onText:({text})=>{ans.text=text; scheduleRender()}}); ans.text=r.text }
    catch(e){ ans.text=e?.code==="not_granted"?"Нужно разрешение на вопросы к Claude. Разреши его в окне, которое появится при следующем вопросе.":e?.code==="rate_limited"?"Слишком много вопросов подряд. Подожди минуту и спроси снова.":"Не получилось ответить: "+(e?.message||"ошибка") }
    UI.chatBusy=false; render(); return false },
};
function coachPrompt(q){
  const s=settings(); const last=finished().slice(-6).map(w=>({дата:w.date,тренировка:w.title,упражнения:w.ex.map(e=>({название:exName(e.exId),цель:e.sets.length+"×"+e.target,подходы:doneSets(e).map(x=>`${x.w||0}кг×${x.r||"?"}`).join(", ")}))}));
  const days=[...Array(7)].map((_,i)=>{const k=ymd(addDays(new Date(),-i)); const d=peekDay(k); return d?{дата:k,сон:d.sleep||null,энергия:d.energy||null,настроение:d.mood||null,ккал:(d.food||[]).reduce((a,f)=>a+num(f.k),0),белок:(d.food||[]).reduce((a,f)=>a+num(f.p),0)}:null}).filter(Boolean);
  const hist=UI.chat.slice(0,-2).slice(-8).map(m=>(m.role==="user"?"Я: ":"Тренер: ")+m.text).join("\n");
  return `Ты — личный тренер по силовым тренировкам и питанию. Отвечай по-русски, коротко и по делу (до 150 слов), с конкретными цифрами там, где они есть в данных. Если вопрос про технику — дай 3–4 ключевых подсказки. Не ставь диагнозы; при боли советуй обратиться к врачу.
Программы пользователя: FullBody A/B/C — 4 подхода, 6–15 повторов, отдых 2–3 мин, разминка 10 мин эллипс, кардио 15 мин с пульсом до 150.
Норма КБЖУ: ${s.target?JSON.stringify(s.target):"не рассчитана"}. Профиль: ${JSON.stringify(s.profile)}.
Последние тренировки: ${JSON.stringify(last)}
Последние дни: ${JSON.stringify(days)}
${hist?"Переписка до этого:\n"+hist+"\n":""}
Вопрос: ${q}`;
}
const CHG={
  sleep:(d,t)=>{day(d.day).sleep=t.value; saveDay(d.day)},
  cardioMin:(d,t)=>{const w=S.workouts[d.id]; w.cardio=w.cardio||{}; w.cardio.min=num(t.value); save("workouts",d.id)},
  body:(d,t)=>{const k=todayKey(); const e=S.body[k]||(S.body[k]={}); if(t.value==="") delete e[d.v]; else e[d.v]=num(t.value); save("body",k)},
  photo:async(d,t)=>{const f=t.files?.[0]; if(!f||!canPhoto()) return; toast("Загружаю фото…"); try{ const pid=Store.assets?(await Store.assets.upload(f)).id:await shrink(f); const k=todayKey(); const e=S.body[k]||(S.body[k]={}); e.photos=[...(e.photos||[]),pid]; save("body",k); render() }catch(e){ toast("Фото не загрузилось: "+(e?.message||"ошибка")) } t.value=""},
  import:async(d,t)=>{const f=t.files?.[0]; if(!f) return; try{ const j=JSON.parse(await f.text()); for(const c of COLLS){ for(const [id,v] of Object.entries(j[c]||{})){ S[c][id]=v; save(c,id) } } toast("Копия восстановлена"); render() }catch(e){ toast("Файл не подходит: нужна резервная копия из этого приложения") } t.value=""},
  "prof-sex":(d,t)=>{settings().profile.sex=t.value; save("meta","settings")}, "prof-age":(d,t)=>{settings().profile.age=t.value; save("meta","settings")},
  "prof-height":(d,t)=>{settings().profile.height=t.value; save("meta","settings")}, "prof-weight":(d,t)=>{settings().profile.weight=t.value; save("meta","settings")},
  "prof-activity":(d,t)=>{settings().profile.activity=num(t.value); save("meta","settings")}, "prof-goal":(d,t)=>{settings().profile.goal=t.value; save("meta","settings")},
};
const INP={
  lesson:(d,t)=>{day(d.day).lesson=t.value; saveDay(d.day); return false},
  wNote:(d,t)=>{S.workouts[d.id].note=t.value; save("workouts",d.id); return false},
  setW:(d,t)=>{const [,e]=findEx(d); e.sets[+d.j].w=t.value; save("workouts",d.id); return false},
  setR:(d,t)=>{const [,e]=findEx(d); e.sets[+d.j].r=t.value; save("workouts",d.id); return false},
  pickQ:(d,t)=>{UI.sheet.q=t.value; renderSheet(); const el=document.getElementById("pick-q"); el.focus(); el.setSelectionRange(t.value.length,t.value.length); return false},
  progName:(d,t)=>{UI.sheet.name=t.value; return false},
};
document.addEventListener("click",ev=>{ if(!audioCtx){ try{audioCtx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){} }
  const t=ev.target.closest("[data-a]"); if(!t||t.disabled) return; const f=ACT[t.dataset.a]; if(!f) return; const r=f(t.dataset,t,ev); if(r!==false&&!(r instanceof Promise)) render() });
document.addEventListener("change",ev=>{ const t=ev.target.closest("[data-c]"); if(!t) return; const r=CHG[t.dataset.c]?.(t.dataset,t); if(!(r instanceof Promise)) render() });
document.addEventListener("input",ev=>{ const t=ev.target.closest("[data-i]"); if(!t) return; INP[t.dataset.i]?.(t.dataset,t) });
document.addEventListener("keydown",ev=>{ if(ev.key==="Escape"&&UI.sheet){UI.sheet=null;render();return} if(ev.key!=="Enter") return; const t=ev.target.closest("[data-enter]"); if(!t) return; ev.preventDefault(); ACT[t.dataset.enter](t.dataset,t,ev); render() });
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&activeWorkout()) keepAwake() });
function applyTheme(){ /* одна тёмная тема в цветах GYMbro */ }
window.addEventListener("hashchange",()=>{ const h=location.hash.slice(1); if(TABS.some(t=>t[0]===h)){UI.tab=h; render()} });

/* ---------- запуск ---------- */
async function boot(){
  const h=location.hash.slice(1); if(TABS.some(t=>t[0]===h)) UI.tab=h;
  const C=window.claude; let db=null,user=null;
  if(C&&C.use){ [db,user]=await Promise.all([C.use("db"),C.use("user")]) }
  if(user){ let own=true; try{ own=await user.isOwner() }catch(e){} if(!own){ Store.mode="locked"; $("#tabs").innerHTML=""; $("#app").innerHTML='<div class="lock"><div class="stack"><h1>Личное приложение</h1><p class="muted">Это приложение работает только для своего владельца.</p></div></div>'; return } }
  if(db){
    Store.mode="db"; Store.db=db;
    C.use("assets").then(a=>{Store.assets=a; scheduleRender()}); C.use("downloads").then(a=>{Store.downloads=a; scheduleRender()}); C.use("sample").then(a=>{Store.sample=a; scheduleRender()});
    setTimeout(()=>{ if(!Store.loaded.size) render() },2500);
    for(const c of COLLS){
      db.collection(c).onSnapshot(snap=>{ let ch=false;
        for(const x of snap.docChanges()){ const id=x.doc.id; if(Store.pending.has(c+"/"+id)) continue;
          if(x.type==="removed"){ if(S[c][id]){ delete S[c][id]; ch=true } continue }
          const js=JSON.stringify(x.doc.data()); if(JSON.stringify(S[c][id])!==js){ S[c][id]=JSON.parse(js); ch=true } }
        const first=!Store.loaded.has(c); Store.loaded.add(c); if(c==="meta") applyTheme(); if(ch||first) scheduleRender();
      },err=>toast("Нет связи с хранилищем: "+(err?.code||"ошибка")+". Обнови страницу."));
    }
  } else {
    Store.mode="local"; try{ navigator.storage?.persist?.() }catch(e){} for(const c of COLLS){ try{ const v=localStorage.getItem("zh_"+c); if(v) S[c]=JSON.parse(v) }catch(e){} } applyTheme(); render();
  }
}
boot();
</script>

<script>if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js");</script>
